name: Fix live tracking completion

on:
  push:
    paths:
      - .github/live-tracking-completion-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch completion state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Components/MyBookings.jsx')
          s = p.read_text()
          old = '["assigned", "on-the-way", "in-progress"].includes(b.status)'
          new = '["in-progress"].includes(b.status)'
          if old not in s:
              raise SystemExit('completion state pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Components/MyBookings.jsx
          git commit -m "Require in-progress status before customer completion [skip ci]"
          git push
