name: Simple live tracking run

on:
  push:
    paths:
      - .github/scripts/simple-live-tracking-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch
        run: python3 .github/scripts/simple_live_tracking_patch.py
      - name: Build
        run: npm install && npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --quiet || git commit -m "Polish customer live tracking flow [skip ci]"
          git push
