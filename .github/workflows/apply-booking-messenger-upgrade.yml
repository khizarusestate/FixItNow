name: Apply booking messenger upgrade
on:
  push:
    branches: [feature/booking-messenger-voice-chat]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-messenger-voice-chat
          fetch-depth: 0
      - name: Apply patch
        run: node tools/apply-booking-messenger-upgrade.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden ICE candidate handling"
          git push origin HEAD:feature/booking-messenger-voice-chat
