name: Apply booking messenger frontend upgrade
on:
  push:
    branches: [feature/booking-messenger-voice-chat]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: node tools/apply-booking-messenger-upgrade.mjs
      - name: Remove one-time patch tooling
        run: rm -f tools/apply-booking-messenger-upgrade.mjs .github/workflows/apply-booking-messenger-upgrade.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement booking-scoped messenger UI and voice calling"
          git push origin HEAD:${GITHUB_REF_NAME}
