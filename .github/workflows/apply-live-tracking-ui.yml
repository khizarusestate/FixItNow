name: Apply live tracking UI patch

on:
  push:
    paths:
      - "scripts/apply-live-tracking-ui.mjs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply patch
        run: node scripts/apply-live-tracking-ui.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Components/MyBookings.jsx scripts/apply-live-tracking-ui.mjs
          if git diff --cached --quiet; then
            echo "No UI changes to commit."
            exit 0
          fi
          git commit -m "Complete customer live tracking UI"
          git push
