name: Fix voice call stability
on:
  push:
    branches: [feature/booking-messenger-voice-chat]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-messenger-voice-chat
          fetch-depth: 0
      - name: Apply stability patch
        run: node tools/fix-voice-call-stability.mjs
      - name: Commit and force-update feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden voice call lifecycle" || exit 0
          git push --force-with-lease origin HEAD:feature/booking-messenger-voice-chat
