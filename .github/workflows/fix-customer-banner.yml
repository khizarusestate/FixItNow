name: Fix customer pending-booking banner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete pending booking banner
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("src/Components/BookingSection.jsx")
          s = p.read_text()
          pattern = re.compile(r'\n\s*\{isAuthenticated &&\s*user\?\.type === "customer" &&\s*pendingBookingCount > 0 && \(.*?\n\s*\)\}\}\s*\n\s*\{\/\* HEADER \*\/\}', re.S)
          new, n = pattern.subn('\n        {/* HEADER */}', s, count=1)
          if n != 1:
              raise SystemExit("Expected pending-booking banner block was not found exactly once")
          p.write_text(new)
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Components/BookingSection.jsx .github/workflows/fix-customer-banner.yml
          git diff --cached --quiet && exit 0
          git rm .github/workflows/fix-customer-banner.yml
          git commit -m "Remove obsolete customer pending booking banner"
          git push origin main
